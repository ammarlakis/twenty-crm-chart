apiVersion: v1
kind: Secret
metadata:
  name: smoke-postgres
type: Opaque
stringData:
  password: smoke-test-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-postgres
  template:
    metadata:
      labels:
        app: smoke-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: twenty
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smoke-postgres
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "twenty"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-postgres
spec:
  selector:
    app: smoke-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-redis
  template:
    metadata:
      labels:
        app: smoke-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-redis
spec:
  selector:
    app: smoke-redis
  ports:
    - port: 6379
      targetPort: 6379
