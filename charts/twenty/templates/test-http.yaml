apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-http" (include "twenty.fullname" . | trunc 53 | trimSuffix "-") }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 60
  automountServiceAccountToken: false
  containers:
    - name: http
      image: busybox:1.37.0
      command: ["sh", "-ec"]
      args:
        - |
          wget -T 10 -O /tmp/health.json "$URL/healthz"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json
          wget -T 10 -O /tmp/index.html "$URL/"
          grep -qi 'twenty' /tmp/index.html
      env:
        - name: URL
          value: {{ printf "http://%s-server:%v" (include "twenty.fullname" .) .Values.server.service.port | quote }}
